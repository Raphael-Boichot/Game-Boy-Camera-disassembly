<title>Last Open Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* One page of questions that only ears or eyes can answer (sounds, SHOOT effects, screens, six pictures). Answers are saved per item, one note and one confidence each. */
:root{
  --bg:#eff0ea; --surface:#f9faf5; --fg:#1c231f; --muted:#5b665d; --line:#d6d9cd; --chip:#e3e6d9;
  --accent:#2d6a64; --accent-fg:#ffffff; --accent-soft:#d9e8e3; --warn:#9a5b14; --warn-soft:#f1e3cc; --good:#2f6f37; --good-soft:#d7e8d4;
  --plate:#f4f4ee;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif; --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131713; --surface:#1b211c; --fg:#e4e9df; --muted:#9aa69b; --line:#2b332c; --chip:#252c26;
  --accent:#78c6bb; --accent-fg:#0c1411; --accent-soft:#1f3532; --warn:#e2a964; --warn-soft:#3a2d18; --good:#8fd08a; --good-soft:#20341f; --plate:#222a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131713; --surface:#1b211c; --fg:#e4e9df; --muted:#9aa69b; --line:#2b332c; --chip:#252c26;
  --accent:#78c6bb; --accent-fg:#0c1411; --accent-soft:#1f3532; --warn:#e2a964; --warn-soft:#3a2d18; --good:#8fd08a; --good-soft:#20341f; --plate:#222a23; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font:700 18px/1.2 var(--font-display);margin:0;margin-right:auto}
.brand small{display:block;font:400 12px/1.3 var(--font-mono);color:var(--muted);margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tab:not([aria-selected="true"]):hover{border-color:var(--line);color:var(--fg)}
.tab b{font:500 12px var(--font-mono);opacity:.85;margin-left:6px}
.prog{font:500 12px var(--font-mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)}
main{padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
.intro{max-width:74ch;display:flex;flex-direction:column;gap:8px}
.intro h2{font:700 24px/1.2 var(--font-display);margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tools .mono{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;align-items:start}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.done{border-color:var(--accent)}
.head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.head b{font:500 14px var(--font-mono)}
.head .ttl{font:600 15px var(--font-body);overflow-wrap:anywhere}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font:500 11px var(--font-mono);padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.clue{font-size:13.5px;margin:0;overflow-wrap:anywhere}
.clue.m{color:var(--muted)}
.told{font-size:13px;margin:0;padding:6px 8px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.ans{display:flex;flex-direction:column;gap:6px}
.ans select,.ans input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.ans input::placeholder{color:var(--muted)}
.view{background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;max-height:480px}
.view canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto}
.ctl{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.ctl button,.ctl select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;cursor:pointer;font-weight:500}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pair{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.pair figcaption{font:500 11px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ref{display:block;image-rendering:pixelated;background:var(--plate);border:1px solid var(--line);border-radius:4px;max-width:100%;height:auto}
.states{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font:400 12px/1.4 var(--font-mono);color:var(--muted)}
.states li{overflow-wrap:anywhere}
.exp{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.exp textarea{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font:400 12px/1.5 var(--font-mono)}
.exp button{align-self:flex-start;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
.play{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.play button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:5px 11px;cursor:pointer;font:600 13px var(--font-mono)}
.play button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.play button:disabled{opacity:.5;cursor:default}
.play .mono{margin-left:2px}
.vol{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.vol input{width:min(220px,100%)}
.audiomsg{font-size:13px;color:var(--warn)}
.foot{font-size:13px;color:var(--muted);max-width:74ch}
</style>
<header class="bar"><div class="wrap">
  <h1 class="brand">Last open questions<small>Pocket Camera (Japan) Rev A, L3 pass, 14 Oct 2026</small></h1>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="prog" id="prog"></div>
</div></header>
<main class="wrap" id="main"></main>
<script>
const D=__DATA__;
const VERD=[['','confidence'],['sure','sure'],['likely','likely'],['guess','guess'],['cannot','cannot tell / not heard']];
const TABS=[['sounds','Sounds',D.sounds.length],['effects','SHOOT effects',D.variants.length],['screens','Screens',D.screens.length],['pics','Pictures',D.pics.length]];
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const ans={}, timers={}, chain={}; let col=null, where='saving here', only=false, cur='sounds';
const titles={};
function allKeys(){return [...D.sounds,...D.variants,...D.screens,...D.pics].map(x=>x.key)}
function done(k){const a=ans[k];return !!(a&&(a.verdict||a.note))}
function prog(){
  const n=allKeys().filter(done).length, tot=allKeys().length;
  $('#prog').replaceChildren(h('span',{class:'dot'+(col?' ok':'')}),h('span',{text:n+' of '+tot+' answered, '+where}));
  TABS.forEach(t=>{const keys={sounds:D.sounds,effects:D.variants,screens:D.screens,pics:D.pics}[t[0]].map(x=>x.key);const b=document.getElementById('tab-'+t[0]);if(b)b.lastChild.textContent=keys.filter(done).length+'/'+keys.length});
  const lines=allKeys().filter(done).map(k=>[k,titles[k]||'',ans[k].verdict||'',(ans[k].note||'').replace(/\s+/g,' ')].join(' | '));
  const ex=$('#exp'); if(ex) ex.value=lines.join('\n');
}
function changed(k){
  const v=document.getElementById('v-'+k).value, n=document.getElementById('n-'+k).value;
  ans[k]={verdict:v,note:n}; const c=document.getElementById('v-'+k).closest('.card'); if(c)c.classList.toggle('done',!!(v||n)); prog();
  clearTimeout(timers[k]); timers[k]=setTimeout(()=>save(k),600);
}
function save(k){
  const a=ans[k]; const body={verdict:a.verdict||'',note:a.note||'',item:titles[k]||k,time:new Date().toISOString()};
  if(!col){try{localStorage.setItem('oa_'+k,JSON.stringify(body))}catch(e){} return}
  chain[k]=(chain[k]||Promise.resolve()).then(()=>(body.verdict||body.note)?col.doc(k).set(body):col.doc(k).delete()).catch(()=>{where='save failed, kept in this browser';try{localStorage.setItem('oa_'+k,JSON.stringify(body))}catch(e){} prog()});
}
function fill(k){const a=ans[k]||{};const v=document.getElementById('v-'+k),n=document.getElementById('n-'+k);if(v)v.value=a.verdict||'';if(n&&document.activeElement!==n)n.value=a.note||'';const c=v&&v.closest('.card');if(c)c.classList.toggle('done',done(k))}
function answerBox(k,ph){
  titles[k]=titles[k]||k;
  return h('div',{class:'ans'},
    h('select',{id:'v-'+k,'aria-label':'Confidence',onchange:()=>changed(k)},VERD.map(o=>h('option',{value:o[0],text:o[1]}))),
    h('input',{id:'n-'+k,type:'text','aria-label':'Your answer',placeholder:ph,autocomplete:'off',oninput:()=>changed(k)}));
}
/* ---- 2bpp tiles */
const PAL=[[244,244,238],[170,176,168],[96,108,100],[22,30,26]];
function drawTiles(cv,b64s,cols,invert,sc){
  const d=Uint8Array.from(atob(b64s),c=>c.charCodeAt(0)); const n=Math.floor(d.length/16), rows=Math.ceil(n/cols);
  cv.width=Math.min(n,cols)*8; cv.height=Math.max(rows,1)*8; const ctx=cv.getContext('2d'), im=ctx.createImageData(cv.width,cv.height);
  for(let t=0;t<n;t++)for(let y=0;y<8;y++){const b0=d[t*16+y*2],b1=d[t*16+y*2+1];for(let x=0;x<8;x++){let p=(((b1>>(7-x))&1)<<1)|((b0>>(7-x))&1); if(invert)p=3-p; const c=PAL[p],o=(((Math.floor(t/cols)*8+y)*cv.width)+(t%cols)*8+x)*4;im.data[o]=c[0];im.data[o+1]=c[1];im.data[o+2]=c[2];im.data[o+3]=255}}
  ctx.putImageData(im,0,0); cv.style.width=(cv.width*sc)+'px';
}
function tileView(b64s,cols0){
  let cols=cols0,inv=false; const cv=h('canvas'); const view=h('div',{class:'view'},cv);
  const redraw=()=>drawTiles(cv,b64s,cols,inv,3);
  const sel=h('select',{'aria-label':'Tiles per row',onchange:e=>{cols=+e.target.value;redraw()}},[4,8,16,20,32].map(c=>h('option',{value:c,text:c+' wide',selected:c===cols0})));
  const bi=h('button',{type:'button','aria-pressed':'false',onclick:e=>{inv=!inv;e.target.setAttribute('aria-pressed',inv);redraw()},text:'invert'});
  setTimeout(redraw,0);
  return h('div',{style:'display:flex;flex-direction:column;gap:6px;min-width:0'},h('div',{class:'ctl'},sel,bi),view);
}
/* ---- audio: every clip is an MP3 inside the page (base64), decoded with WebAudio on the first click (browsers only start sound after a click) */
const AUD={ctx:null,buf:{},src:null,btn:null,gain:2.6,msg:null};
function audStop(){const s=AUD.src,b=AUD.btn;AUD.src=null;AUD.btn=null;if(s){try{s.onended=null;if(s.stop)s.stop();else s.pause()}catch(e){}}if(b)b.setAttribute('aria-pressed','false')}
function audErr(t){if(AUD.msg)AUD.msg.textContent=t}
async function audPlay(key,btn){
  if(AUD.btn===btn){audStop();return}
  audStop();audErr('');const c=(D.clips||{})[key];if(!c){audErr('No clip for '+key+'.');return}
  btn.setAttribute('aria-pressed','true');AUD.btn=btn;
  const done=()=>{if(AUD.btn===btn){AUD.btn=null;AUD.src=null;btn.setAttribute('aria-pressed','false')}};
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('no WebAudio');
    AUD.ctx=AUD.ctx||new AC();if(AUD.ctx.state==='suspended')await AUD.ctx.resume();
    let b=AUD.buf[key];
    if(!b){const bin=atob(c.b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      b=await new Promise((ok,ko)=>{const r=AUD.ctx.decodeAudioData(u.buffer,ok,ko);if(r&&r.then)r.then(ok,ko)});AUD.buf[key]=b}
    if(AUD.btn!==btn)return;
    const s=AUD.ctx.createBufferSource(),g=AUD.ctx.createGain();s.buffer=b;g.gain.value=AUD.gain;s.connect(g);g.connect(AUD.ctx.destination);s.onended=done;AUD.src=s;s.start();
  }catch(e1){
    try{const a=new Audio('data:audio/mpeg;base64,'+c.b);a.volume=1;a.onended=done;a.onerror=()=>{done();audErr('This view cannot play the clip (audio blocked or MP3 not supported).')};AUD.src=a;await a.play()}
    catch(e2){done();audErr('This view cannot play the clip (audio blocked or MP3 not supported): '+(e2&&e2.message||e1&&e1.message||''))}
  }
}
function playRow(ch,ids){
  const row=h('div',{class:'play'});
  ids.forEach(id=>{const c=(D.clips||{})[ch+'_'+id];
    const b=h('button',{type:'button',disabled:!c,'aria-pressed':'false',title:c?'play the BGB recording of id '+id:'no clip'},h('span',{text:'\u25B6'}),h('span',{text:id}));
    b.onclick=()=>audPlay(ch+'_'+id,b);row.append(b);
    if(c)row.append(h('span',{class:'mono',text:c.s.toFixed(1)+' s'+(c.cut?' (start of a longer sound)':'')}))});
  return row;
}
/* ---- sections */
function sounds(){
  const wrap=h('div',{class:'cards'});
  D.sounds.forEach(s=>{
    titles[s.key]='sound '+s.chn.split(' ')[0]+' '+s.chn.split(' ')[1]+' id '+s.ids+' ('+s.tag+')';
    wrap.append(h('div',{class:'card','data-k':s.key},
      h('div',{class:'head'},h('b',{text:'id '+s.ids}),h('span',{class:'ttl',text:s.tag}),h('span',{class:'pill',text:s.chn})),
      h('p',{class:'clue m'},'Handlers '+s.addrs+' (bank 1F). The tag comes from the place of the call in the game, not from the sound.'),
      playRow(s.ch,s.ids.split(' ')),
      s.owner&&h('p',{class:'told',text:s.owner}),
      answerBox(s.key,'what you hear, or where in the game')));
  });
  const vol=h('input',{type:'range',min:'0.5',max:'4',step:'0.1',value:String(AUD.gain),'aria-label':'volume'});vol.oninput=()=>{AUD.gain=+vol.value};
  AUD.msg=h('span',{class:'audiomsg',role:'status'});
  return [h('div',{class:'intro'},h('h2',{text:'Sounds'}),h('p',{text:'One row per sound id of the three effect channels (the song channel is not in this list). Press a play button to hear the id. The tag is my guess from the code that asks for the sound. If you can recognise one, write what it is (short rising beep, boing, noise burst...) and the moment of the game it belongs to; a different name than my tag is welcome, a blank row is fine.'}),
    h('p',{text:'The clips are what the BGB emulator\u2019s sound chip produced when the game was asked for each id on its own (the menu music switched off first). Nobody has listened to them yet, and an emulator is not a real Game Boy: if a clip sounds wrong, say so in the note.'}),
    h('div',{class:'vol'},h('label',{},'Volume '),vol,AUD.msg)),wrap];
}
function effects(){
  const wrap=h('div',{class:'cards wide'});
  D.variants.forEach(v=>{
    titles[v.key]='SHOOT variant '+v.v+' (phases '+v.phases+')';
    wrap.append(h('div',{class:'card','data-k':v.key},
      h('div',{class:'head'},h('b',{text:'variant '+v.v}),h('span',{class:'mono',text:'phases '+v.phases})),
      h('p',{class:'clue m'},'Routines: '+v.names.join(', ')+'.'),
      h('p',{class:'clue m'},v.pages.join('   |   ')),
      answerBox(v.key,'what this variant does on the screen')));
  });
  return [h('div',{class:'intro'},h('h2',{text:'SHOOT effects'}),h('p',{text:'The camera screen picks an effect routine from a table: the SHOOT variant counter (0 to $15, 22 values) times a second counter of 4 phases (0 to 3), then one of three pages of 32 slots; variants 0, 1 and 2 use the same routine in every phase. The routines copy or mirror the sensor image (A100 and so on) into the display buffer, or reduce it step by step, and I cannot tell from the code which menu entry or visible effect each variant is. If you know the list of the SHOOT-mode effects in their menu order (the manual or the Funtography guide), write it on the first row and I will map it onto the variants; or answer the variants you know.'})),wrap];
}
function screens(){
  const wrap=h('div',{class:'cards wide'});
  D.screens.forEach(s=>{
    titles[s.key]='mode '+s.mode+(s.title?' '+s.title:'');
    wrap.append(h('div',{class:'card','data-k':s.key},
      h('div',{class:'head'},h('b',{text:'mode '+s.mode}),h('span',{class:'ttl',text:s.title||'(unnamed)'}),h('span',{class:'pill',text:s.states.length+' states / helpers'})),
      h('ul',{class:'states'},s.states.map(x=>h('li',{text:x.a+'  '+x.n}))),
      answerBox(s.key,'what these states show on the screen')));
  });
  return [h('div',{class:'intro'},h('h2',{text:'Screens'}),h('p',{text:'Ten modes whose state names are still generic. Many entries are helpers that draw no screen of their own; the ones named State... are dialogs, pages or confirmation boxes of the mode. Tell me what you see in that mode (a dialog title, an icon, the number of pages) for the states you recognise, in the order the names suggest.'})),wrap];
}
function pics(){
  const wrap=h('div',{class:'cards wide'});
  D.pics.forEach(p=>{
    titles[p.key]=p.title;
    const pair=h('div',{class:'pair'},h('figure',{},h('figcaption',{text:p.name}),tileView(p.data,p.cols)));
    if(p.ctx)pair.append(h('figure',{},h('figcaption',{text:p.ctxcap}),tileView(p.ctx,16)));
    if(p.ref)pair.append(h('figure',{},h('figcaption',{text:p.refcap}),h('img',{class:'ref',src:p.ref,alt:p.refcap,style:'width:min(100%,256px)'})));
    wrap.append(h('div',{class:'card','data-k':p.key},
      h('div',{class:'head'},h('b',{text:p.title})),pair,h('p',{class:'clue',text:p.clue}),
      answerBox(p.key,'what it is, or where you saw it')));
  });
  return [h('div',{class:'intro'},h('h2',{text:'Pictures'}),h('p',{text:'The last spans of the ROM that I cannot name from the code, drawn as 2bpp tiles (width, invert and the reference strips help). Two of them are TCRF candidates whose tiles also appear in normal play.'})),wrap];
}
const BUILD={sounds,effects,screens,pics};
function show(t){
  cur=t; const main=$('#main'); main.replaceChildren(...BUILD[t](),
    h('div',{class:'tools'},h('label',{},h('input',{type:'checkbox',id:'only',checked:only?true:null,onchange:e=>{only=e.target.checked;apply()}}),'only the unanswered'),h('span',{class:'mono',text:'each answer is saved when you stop typing'})));
  const tools=main.querySelector('.tools'); const intro=main.querySelector('.intro'); intro.after(tools);
  main.append(h('section',{class:'exp'},h('h2',{style:'font:700 17px var(--font-display);margin:8px 0 0',text:'All answers as text'}),h('textarea',{id:'exp',readonly:true,'aria-label':'All answers'}),h('div',{style:'display:flex;gap:10px;align-items:center'},h('button',{type:'button',id:'copy',text:'Copy'}),h('span',{class:'mono',id:'copied'})),h('p',{class:'foot',text:'Nothing here has to be filled: an empty row stays I (inferred) in the symbol file, an answer moves the name to C (confirmed) with your confidence in the note.'})));
  $('#copy').onclick=async()=>{const t=$('#exp'); try{await navigator.clipboard.writeText(t.value);$('#copied').textContent='Copied'}catch(e){t.select();$('#copied').textContent='Press copy on the selected text'}};
  allKeys().forEach(fill); apply(); prog();
  TABS.forEach(x=>{const b=document.getElementById('tab-'+x[0]);b.setAttribute('aria-selected',x[0]===t)});
  try{history.replaceState(null,'','#'+t)}catch(e){}
}
function apply(){document.querySelectorAll('.card[data-k]').forEach(c=>{c.hidden=only&&done(c.dataset.k)})}
$('#tabs').replaceChildren(...TABS.map(t=>h('button',{class:'tab',id:'tab-'+t[0],type:'button','aria-selected':'false',onclick:()=>show(t[0])},t[1],h('b',{text:'0/'+t[2]}))));
Object.values(BUILD).forEach(f=>f());   // fills the titles of every item for the text export
(async()=>{
  let db=null; try{db=await claude.use('db')}catch(e){}
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i); if(key.startsWith('oa_')){const x=JSON.parse(localStorage.getItem(key)); ans[key.slice(3)]={verdict:x.verdict||'',note:x.note||''}}}}catch(e){}
  const hh=(location.hash||'').slice(1); show(TABS.some(t=>t[0]===hh)?hh:'sounds');
  if(db){
    col=db.collection('answers'); where='saved';
    col.onSnapshot(s=>{s.docs.forEach(d=>{const x=d.data(); if(x&&!timers[d.id]){ans[d.id]={verdict:x.verdict||'',note:x.note||''}; fill(d.id)}}); prog(); apply()},()=>{col=null;where='this browser only';prog()});
  } else {where='this browser only'}
  prog();
})();
</script>
